name: alaida
description: "Alaida - alarma SOS y red de ayuda cercana."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  geolocator: ^14.1.0
  google_maps_flutter: ^2.18.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  vibration: ^3.2.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7659D0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
